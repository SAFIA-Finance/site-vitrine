name: Construire et déployer

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Appelé par .github/workflows/notes.yml : une poussée faite avec le
  # GITHUB_TOKEN ne déclenche pas d'autre workflow, le déploiement doit donc
  # être demandé explicitement.
  workflow_call:

# Droits requis par le déploiement GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire
        env:
          # Définies dans Settings > Secrets and variables > Actions > Variables.
          #
          # Le repli de SITE_URL désignait « sitev2.safia.finance » jusqu'au
          # 18 septembre 2026, un sous-domaine depuis supprimé. La variable
          # effacée, le déploiement serait parti en production avec toutes ses
          # canoniques vers un domaine mort, sans qu'aucune étape n'échoue.
          # Il n'existe plus qu'un domaine : le repli le désigne.
          SITE_URL: ${{ vars.SITE_URL || 'https://safia.finance' }}
          # INDEXABLE reste à « false » par défaut, donc le site partirait en
          # noindex si la variable disparaissait. C'était la bonne prudence du
          # temps de la préversion ; ça ne l'est plus, puisqu'il n'y a plus
          # qu'un site, et qu'un noindex silencieux le retirerait de Google.
          # À trancher avec Maxime avant d'inverser ce repli.
          INDEXABLE: ${{ vars.INDEXABLE || 'false' }}
        run: npm run build

      - name: Vérifier les liens internes
        run: npm run verifier

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deployer:
    name: Déployer sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
